name: ニュース・noteの収集

on:
  # 定期実行は Cloudflare Workers の Cron Triggers（cron-worker/）に移した。
  # GitHub の schedule は混雑時に飛ばされ、毎時のはずが数時間おきになるため。
  # ここは手動で1回だけ収集したいとき用に残している
  workflow_dispatch:

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: 収集APIを呼び出す
        # サイトのURLは公開情報なのでそのまま書き、合言葉だけ Secrets に置く
        run: |
          curl --fail --silent --show-error \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "https://yorushika.sukinote.com/api/cron/collect"
