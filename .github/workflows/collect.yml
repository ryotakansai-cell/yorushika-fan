name: ニュース・noteの収集

on:
  schedule:
    # 毎時47分。「0分」は世界中のジョブが集中してGitHub側で遅延・スキップされやすい。
    # ゲームトレンドの収集（23分・38分）とも重ならない時刻にしている
    - cron: "47 * * * *"
  # GitHubの画面から手動でも実行できるようにする（動作確認用）
  workflow_dispatch:

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: 収集APIを呼び出す
        # サイトのURLは公開情報なのでそのまま書き、合言葉だけ Secrets に置く
        run: |
          curl --fail --silent --show-error \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "https://yorushika-fan.vercel.app/api/cron/collect"
