<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>Bluesky バナー案 v2</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400&display=swap" rel="stylesheet">
<style>
  body { margin:0; background:#fff; font-family:"Noto Sans JP",sans-serif; }
  .banner { position:relative; width:1500px; height:500px; overflow:hidden; background:#fff; }
  .credit { position:absolute; right:0; bottom:0; font-size:9.5px; color:#333; background:rgba(255,255,255,.8); padding:2px 8px; }
</style>
</head>
<body>
<div id="root"></div>
<script>
// 写真は Wikimedia Commons の自由ライセンスのもの（data/scenes.json に登録済みで、撮影者名とライセンスを確認したもの）。
// 撮影者名とライセンスは画像の中に必ず入れる。CC BY-SA を含むので、このバナー自体も CC BY-SA 4.0 として扱う
const PHOTOS = [
  { name: "雨晴", artist: "そらみみ", license: "CC BY-SA 4.0" },
  { name: "下灘", artist: "Hiroaki Kaneko", license: "CC BY-SA 3.0" },
  { name: "根川緑道", artist: "根川孝太郎", license: "CC BY-SA 3.0" },
  { name: "昭和記念公園", artist: "TANAKA Juuyoh (田中十洋)", license: "CC BY 2.0" },
  { name: "常滑", artist: "gundam2345", license: "CC BY 3.0" },
  { name: "猿島", artist: "menma1/2", license: "CC BY 3.0" },
  { name: "白浜", artist: "Kunio Okita", license: "CC0" },
];
// 縮小画像のURLは data/scenes.json から埋め込んだもの（下の SCENE_THUMBS）
</script>
<script>
const SCENE_THUMBS = {
 "雨晴": "https://thumb.wikimedia.org/wikipedia/commons/thumb/4/4b/Himi_Line_from_railroad_crossing_west_of_Amaharashi_Station.JPG/1280px-Himi_Line_from_railroad_crossing_west_of_Amaharashi_Station.JPG",
 "下灘": "https://thumb.wikimedia.org/wikipedia/commons/thumb/a/aa/%E9%BB%84%E6%98%8F%E3%81%AE%E4%B8%8B%E7%81%98%E9%A7%85_%28Shimonada_Station_in_twilight%29_22_Nov%2C_2014_-_panoramio.jpg/1280px-%E9%BB%84%E6%98%8F%E3%81%AE%E4%B8%8B%E7%81%98%E9%A7%85_%28Shimonada_Station_in_twilight%29_22_Nov%2C_2014_-_panoramio.jpg",
 "根川緑道": "https://thumb.wikimedia.org/wikipedia/commons/thumb/1/19/%E6%A0%B9%E5%B7%9D%E7%B7%91%E9%81%93_02.jpg/1280px-%E6%A0%B9%E5%B7%9D%E7%B7%91%E9%81%93_02.jpg",
 "昭和記念公園": "https://thumb.wikimedia.org/wikipedia/commons/thumb/9/9b/Orychophragmus_violaceus_in_Showa_kinen_park.jpg/1280px-Orychophragmus_violaceus_in_Showa_kinen_park.jpg",
 "常滑": "https://thumb.wikimedia.org/wikipedia/commons/thumb/2/2e/%E5%B8%B8%E6%BB%91%EF%BC%88%E7%99%BB%E7%AA%AF%E5%BA%83%E5%A0%B4%EF%BC%89_-_panoramio.jpg/1280px-%E5%B8%B8%E6%BB%91%EF%BC%88%E7%99%BB%E7%AA%AF%E5%BA%83%E5%A0%B4%EF%BC%89_-_panoramio.jpg",
 "猿島": "https://thumb.wikimedia.org/wikipedia/commons/thumb/a/a4/%E7%8C%BF%E5%B3%B6_-_panoramio.jpg/1280px-%E7%8C%BF%E5%B3%B6_-_panoramio.jpg",
 "白浜": "https://thumb.wikimedia.org/wikipedia/commons/thumb/f/f2/Sunrise_%28202405897%29.jpeg/1280px-Sunrise_%28202405897%29.jpeg"
};
</script>
<script>
const root = document.getElementById("root");
const only = location.hash.slice(1);

// 1枚のバナーを SVG で描く。skew: 区切りの傾き（px）、gap: 白い区切りの幅、blur: 区切りのぼかし
function banner(id, { skew, gap, blur }) {
  const W = 1500, H = 500, n = PHOTOS.length;
  const step = (W + Math.abs(skew)) / n, start = skew > 0 ? -skew : 0;
  let defs = `<filter id="${id}b" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="${blur}"/></filter>`, body = "";
  PHOTOS.forEach((p, i) => {
    const x0 = start + i * step + gap / 2, x1 = start + (i + 1) * step - gap / 2;
    // 上辺を skew だけ右にずらした平行四辺形。上下ははみ出させて、端がぼけないようにする
    const t = skew * (1 + 40 / H);
    const pts = `${x0 + t},${-40} ${x1 + t},${-40} ${x1 - skew * 40 / H},${H + 40} ${x0 - skew * 40 / H},${H + 40}`;
    defs += `<mask id="${id}m${i}" maskUnits="userSpaceOnUse" x="-100" y="-100" width="${W + 200}" height="${H + 200}"><polygon points="${pts}" fill="#fff" ${blur ? `filter="url(#${id}b)"` : ""}/></mask>`;
    const bx = Math.min(x0, x0 + t) - 30, bw = (x1 - x0) + Math.abs(t) + 60;
    body += `<image href="${SCENE_THUMBS[p.name]}" x="${bx}" y="-40" width="${bw}" height="${H + 80}" preserveAspectRatio="xMidYMid slice" mask="url(#${id}m${i})"/>`;
  });
  const credit = PHOTOS.map(p => `${p.artist}（${p.license}）`).join(" / ");
  return `<div class="banner"><svg width="${W}" height="${H}"><defs>${defs}</defs><rect width="${W}" height="${H}" fill="#fff"/>${body}</svg>
    <div class="credit">写真：${credit}・Wikimedia Commons</div></div>`;
}
const variants = {
  F: { skew: 140, gap: 26, blur: 10 },   // 斜め・ふんわり
  G: { skew: 0, gap: 26, blur: 10 },     // 縦・ふんわり
  H: { skew: 140, gap: 7, blur: 0 },    // 斜め・くっきり細線
};
for (const [k, v] of Object.entries(variants)) {
  if (only && only !== k) continue;
  root.insertAdjacentHTML("beforeend", (only ? "" : `<h2 style="font:16px sans-serif;margin:20px 0 6px">${k}</h2>`) + banner(k, v));
}
</script>
</body>
</html>
