<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000">
  <defs>
    <mask id="moon">
      <rect width="1000" height="1000" fill="#000"/>
      <circle cx="610" cy="420" r="92" fill="#fff"/>
      <circle cx="650" cy="392" r="84" fill="#000"/>
    </mask>
    <clipPath id="win"><rect x="250" y="200" width="500" height="600" rx="250"/></clipPath>
  </defs>
  <rect width="1000" height="1000" fill="#f7f5f0"/>
  <g clip-path="url(#win)">
    <rect x="250" y="200" width="500" height="600" fill="#1f3347"/>
    <rect width="1000" height="1000" fill="#f7f5f0" mask="url(#moon)"/>
    <circle cx="380" cy="380" r="9" fill="#f7f5f0" opacity=".8"/>
    <circle cx="640" cy="640" r="7" fill="#f7f5f0" opacity=".6"/>
  </g>
  <rect x="250" y="200" width="500" height="600" rx="250" fill="none" stroke="#262626" stroke-width="18"/>
  <line x1="500" y1="200" x2="500" y2="800" stroke="#262626" stroke-width="14"/>
  <line x1="250" y1="540" x2="750" y2="540" stroke="#262626" stroke-width="14"/>
</svg>
